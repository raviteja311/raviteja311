<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-label="Jetti Raviteja, Data Analyst and Junior Data Scientist">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#EEEEF3" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect width="1280" height="300" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1280" height="300" fill="#FFFFFF"/>
    <rect width="1280" height="300" fill="url(#grid)"/>
    <rect width="1280" height="300" fill="url(#fade)"/>
    <rect width="8" height="300" fill="#5048E5"/>
    <!-- abstract node graph, right side -->
    <g stroke="#C7C4F7" stroke-width="1.5" fill="none">
      <path d="M930 90 L1030 150 L1140 100 M1030 150 L1000 230 L1120 215 L1140 100 M1120 215 L1210 170 L1140 100"/>
    </g>
    <g fill="#5048E5">
      <circle cx="930" cy="90" r="6"/><circle cx="1030" cy="150" r="9"/><circle cx="1140" cy="100" r="7"/>
      <circle cx="1000" cy="230" r="5"/><circle cx="1120" cy="215" r="7"/><circle cx="1210" cy="170" r="5"/>
    </g>
    <g font-family="Segoe UI, -apple-system, Helvetica Neue, Arial, sans-serif">
      <text x="72" y="72" font-family="Consolas, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" letter-spacing="2.5" fill="#5048E5">OPEN TO OPPORTUNITIES  ·  HYDERABAD, INDIA</text>
      <text x="68" y="150" font-size="68" font-weight="800" fill="#09090B" letter-spacing="-1.5">Jetti Raviteja</text>
      <text x="72" y="198" font-size="28" font-weight="600" fill="#5048E5">Data Analyst and Junior Data Scientist</text>
      <text x="72" y="244" font-size="20" fill="#53535A">Data analytics  /  NLP  /  MLOps  /  RAG and LLM applications</text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="299" rx="20" fill="none" stroke="#E3E3E8"/>
</svg>
